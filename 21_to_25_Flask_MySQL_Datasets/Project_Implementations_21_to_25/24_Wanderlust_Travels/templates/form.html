{% extends 'base.html' %}{% block body %}<section class="card"><h2>{{title}}</h2><form method="post">{% for f in fields %}{% if f=='description' %}<textarea name="{{f}}" placeholder="{{f|title}}" rows="4"></textarea>{% else %}<input name="{{f}}" placeholder="{{f|title}}" {% if f in ['email','password'] %}type="{{f}}"{% endif %} required>{% endif %}{% endfor %}{% if register %}<select name="role"><option value="user">User</option><option value="director">Director / Provider</option><option value="driver">Driver</option><option value="hospital">Hospital</option><option value="mechanic">Mechanic</option></select>{% endif %}<button>Submit</button></form></section>{% endblock %}
