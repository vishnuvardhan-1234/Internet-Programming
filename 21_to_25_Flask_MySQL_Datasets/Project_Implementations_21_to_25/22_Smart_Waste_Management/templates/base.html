<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><style>
body{font-family:Arial;margin:0;background:#f4f6fa;color:#222}header{background:#17365d;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}a{color:#1765ad;text-decoration:none}nav a{color:white;margin-left:14px}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:white;padding:18px;margin:12px 0;border-radius:10px;box-shadow:0 2px 8px #ddd}input,textarea,select{padding:10px;margin:6px 0;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:5px}button,.btn{background:#1765ad;color:white;border:0;padding:10px 14px;border-radius:5px;cursor:pointer}.muted{color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.msg{background:#fff3cd;padding:10px;border-radius:6px}</style></head><body><header><strong>{{ title }}</strong><nav><a href="/">Browse</a>{% if session.email %}<a href="/add">Post</a><a href="/dashboard">Dashboard</a><a href="/admin/applications">Applications</a><a href="/logout">Logout ({{ session.name }})</a>{% else %}<a href="/login">Login</a><a href="/register">Register</a>{% endif %}</nav></header><main class="wrap">{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="msg">{{m}}</p>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main></body></html>
